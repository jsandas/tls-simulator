server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

server {
    listen       443 ssl;
    server_name  localhost;

    ssl_certificate      conf.d/cert-rsa.pem;
    ssl_certificate_key  conf.d/cert-rsa.key;

    ssl_certificate      conf.d/cert-ecc.pem;
    ssl_certificate_key  conf.d/cert-ecc.key;

    ssl_certificate      conf.d/cert-mldsa.pem;
    ssl_certificate_key  conf.d/cert-mldsa.key;

    ssl_prefer_server_ciphers   on;
    ssl_protocols               TLSv1.3;
    ssl_ciphers                 HIGH;
    ssl_ecdh_curve              X25519MLKEM768:X25519;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
